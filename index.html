<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

<script>
  window.__pwaInstallEvent = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    // Do NOT call e.preventDefault() - let Chrome still show its
    // own default install UI as usual; we just keep an extra
    // reference to the event for our own "Install" button too.
    window.__pwaInstallEvent = e;
  });
  window.__canInstallPwa = function() {
    return window.__pwaInstallEvent !== null;
  };
  window.__triggerPwaInstall = function() {
    if (window.__pwaInstallEvent) {
      window.__pwaInstallEvent.prompt();
      // An event's prompt() can only be called ONCE (per Chrome's
      // spec) - clear it right away to avoid a silent failure on
      // a second call.
      window.__pwaInstallEvent = null;
    }
  };
  // App is now installed (whether via Chrome's own banner or our
  // own button) - clear the reference so the in-app button hides
  // itself next time.
  window.addEventListener('appinstalled', function() {
    window.__pwaInstallEvent = null;
  });
</script>


<style>
  /* BỐ CỤC PHẢI KHỚP TUYỆT ĐỐI với splash Flutter (Stack + Align),
     nếu không logo sẽ NHẢY VỊ TRÍ lúc chuyển từ lớp HTML sang lớp
     Flutter - đúng lỗi vừa gặp.
     Bản trước dùng flex `.mid{flex:1}` -> logo nằm giữa VÙNG CÒN LẠI
     sau khi trừ chữ + vòng xoay ở đáy, tức CAO HƠN tâm màn hình.
     Nay dùng định vị tuyệt đối: logo tâm màn hình, chữ + vòng xoay
     cách đáy 56px - giống y Alignment.center và bottomCenter. */
  #smsplash{position:fixed;inset:0;background:#DC711D;
    z-index:9999;transition:opacity .35s ease}
  /* Logo: tâm màn hình. transform:translate(-50%,-50%) đưa TÂM ảnh
     về đúng điểm giữa, không phải góc trên-trái của ảnh. */
  #smsplash .logo{position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);width:120px;height:120px}
  #smsplash .logo img{width:100%;height:100%;object-fit:contain}
  /* Khối dưới: cách đáy 56px, căn giữa ngang. */
  #smsplash .bot{position:absolute;left:0;right:0;bottom:56px;
    display:flex;flex-direction:column;align-items:center}
  /* Hàng ngang: badge icon + tên app - PHẢI KHỚP splash Flutter
     (Row: ô 26px bo góc 6px, nền #ffffff mờ 15%, cách chữ 9px),
     nếu lệch thì lúc chuyển từ lớp HTML sang Flutter sẽ thấy nhảy. */
  #smsplash .t{display:flex;align-items:center;gap:9px;
    color:#fff;font:700 17px system-ui,-apple-system,sans-serif;
    letter-spacing:.3px}
  /* Badge icon: khớp Container 26x26, bo 6px, nền #ffffff @15% của Flutter. */
  #smsplash .ic{width:26px;height:26px;border-radius:6px;flex:0 0 auto;
    background:rgba(255,255,255,.20);display:flex;align-items:center;
    justify-content:center}
  #smsplash .s{width:20px;height:20px;margin-top:18px;box-sizing:border-box;
    border:2.2px solid rgba(255,255,255,.15);border-top-color:#ffffff;
    border-radius:50%;animation:smspin .9s linear infinite}
  @keyframes smspin{to{transform:rotate(360deg)}}
</style>

<script>
  // Remove the splash once Flutter has painted its first frame.
  // Has a 12s hard cutoff in case the engine fails to load - it's
  // better to land on a broken app than get stuck on the splash
  // forever with nothing to tap.
  (function(){
    var el=document.getElementById('smsplash');
    function bye(){ if(!el) return; el.style.opacity='0';
      setTimeout(function(){ el&&el.remove(); el=null; },400); }
    window.addEventListener('flutter-first-frame', bye);
    setTimeout(bye, 12000);
  })();
